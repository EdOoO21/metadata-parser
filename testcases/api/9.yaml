version: 1

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: api_case_09_basic_entities
    kind: rest
    config:
      base_url: http://localhost:8081
      discovery:
        mode: openapi
        openapi_url: http://localhost:8081/openapi.json

  - name: api_case_09_catalog_params
    kind: rest
    config:
      base_url: http://localhost:8087
      discovery:
        mode: openapi
        openapi_url: http://localhost:8087/openapi.json

  - name: api_case_09_support_params
    kind: rest
    config:
      base_url: http://localhost:8088
      discovery:
        mode: openapi
        openapi_url: http://localhost:8088/openapi.json
