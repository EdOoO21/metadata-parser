version: 1

# This config is intended for `make metadata-diff CATEGORY=mixed CASE=1`.
# The files path `./demo/files/diff/1/current` is created by scripts/metadata_diff.sh,
# while PostgreSQL and API data are swapped between `baseline` and `changed`
# behind the same DSN and base URL.

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: diff_mixed_case_01_files_a
    kind: files
    config:
      path: ./demo/files/diff/1/current
      max_depth: 0

  - name: diff_mixed_case_01_postgres
    kind: postgres
    config:
      dsn_env: DEMO_PG_DSN

  - name: diff_mixed_case_01_api
    kind: rest
    config:
      base_url: http://localhost:8081
      discovery:
        mode: openapi
        openapi_url: http://localhost:8081/openapi.json
