version: 1

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: diff_mixed_case_01_files_a
    kind: files
    config:
      path: ./demo/files/diff/1/current
      max_depth: 0

  - name: diff_mixed_case_01_postgres
    kind: postgres
    config:
      dsn_env: DEMO_PG_DSN

  - name: diff_mixed_case_01_api
    kind: rest
    config:
      base_url: http://localhost:8081
      discovery:
        mode: openapi
        openapi_url: http://localhost:8081/openapi.json
