version: 1

# This config is intended for `make metadata-diff CATEGORY=api CASE=2`.
# scripts/metadata_diff.sh keeps the same base URL and swaps demo API data
# between `baseline` and `changed` behind that URL.

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: diff_api_case_02
    kind: rest
    config:
      base_url: http://localhost:8082
      discovery:
        mode: openapi
        openapi_url: http://localhost:8082/openapi.json
