version: 1

# This config is intended for `make metadata-diff CATEGORY=api CASE=1`.
# scripts/metadata_diff.sh keeps the same base URL and swaps demo API data
# between `baseline` and `changed` behind that URL.

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: diff_api_case_01
    kind: rest
    config:
      base_url: http://localhost:8081
      discovery:
        mode: openapi
        openapi_url: http://localhost:8081/openapi.json
