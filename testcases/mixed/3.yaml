version: 1

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: mixed_case_03_files_csv
    kind: files
    config:
      path: ./demo/files/test_7/balances.csv

  - name: mixed_case_03_files_parquet
    kind: files
    config:
      path: ./demo/files/test_5
      max_depth: 1

  - name: mixed_case_03_postgres
    kind: postgres
    config:
      dsn_env: DEMO_PG_DSN

  - name: mixed_case_03_api
    kind: rest
    config:
      base_url: http://localhost:8082
      discovery:
        mode: openapi
        openapi_url: http://localhost:8082/openapi.json
