version: 1

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: mixed_case_06_files_broken
    kind: files
    config:
      path: ./demo/files/test_10
      max_depth: 0

  - name: mixed_case_06_postgres
    kind: postgres
    config:
      dsn_env: DEMO_PG_DSN

  - name: mixed_case_06_api
    kind: rest
    config:
      base_url: http://localhost:8087
      discovery:
        mode: openapi
        openapi_url: http://localhost:8087/openapi.json
