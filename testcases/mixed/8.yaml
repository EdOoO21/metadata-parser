version: 1

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: mixed_case_08_files_root
    kind: files
    config:
      path: ./demo/files/test_1
      max_depth: 0

  - name: mixed_case_08_files_nested
    kind: files
    config:
      path: ./demo/files/test_3
      max_depth: 3

  - name: mixed_case_08_files_deep
    kind: files
    config:
      path: ./demo/files/test_12
      max_depth: 3

  - name: mixed_case_08_postgres
    kind: postgres
    config:
      dsn_env: DEMO_PG_DSN

  - name: mixed_case_08_api
    kind: rest
    config:
      base_url: http://localhost:8088
      discovery:
        mode: openapi
        openapi_url: http://localhost:8088/openapi.json
