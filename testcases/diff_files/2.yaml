version: 1

# This config is intended for `make metadata-diff CATEGORY=files CASE=2`.
# The path `./demo/files/diff/2/current` is created by scripts/metadata_diff.sh
# by copying either `baseline` or `changed` into the same logical source path.

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: diff_files_case_02
    kind: files
    config:
      path: ./demo/files/diff/2/current
      max_depth: 2
