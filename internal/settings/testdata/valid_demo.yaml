version: 1

catalog:
  dsn_env: CATALOG_DSN

sources:
  - name: demo_postgres
    kind: postgres
    config:
      dsn_env: DEMO_PG_DSN

  - name: demo_files
    kind: files
    config:
      path: ./demo/files
      max_depth: 1

  - name: demo_api
    kind: rest
    config:
      base_url: http://localhost:8080
      discovery:
        mode: openapi
        openapi_url: http://localhost:8080/openapi.json
